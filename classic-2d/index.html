<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Table | Classic 2D Website</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="app-header">
        <h1>Periodic Table <span class="accent-text">2D</span></h1>
        <p>A classic 2D representation of the periodic table of elements.</p>

        <!-- Filter Controls Container -->
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">All Elements</button>
            <button class="filter-btn" data-filter="nonmetal">Nonmetals</button>
            <button class="filter-btn" data-filter="alkali-metal">Alkali Metals</button>
            <button class="filter-btn" data-filter="noble-gas">Noble Gases</button>
        </div>
    </header>

    <main class="table-wrapper">

        <!-- The main container where JavaScript will place the elements -->
        <div id="periodic-table" class="periodic-grid"></div>
    </main>

    <!-- Overlay Modal for Detailed Inspector View -->
     <div id="element-model" class="model-backdrop hidden">
        <div class="model-content">
            <button id="close-model" class="close-btn">&times;</button>
            <div class="model-body">
                <div class="model-hero">
                    <span id="model-number" class="elem-number"></span>
                    <h2 id="model-symbol" class="elem-symbol"></h2>
                    <p id="model-name" class="elem-name"></p>
                </div>
            </div>
        </div>
     </div>


    <script type="module" src="js/app.js"></script>
</body>
</html>
